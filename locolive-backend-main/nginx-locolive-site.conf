# LocoLive Nginx Site Configuration
# Drop this into /etc/nginx/sites-available/locolive
# Then: ln -s /etc/nginx/sites-available/locolive /etc/nginx/sites-enabled/locolive

upstream locolive_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name locolive.appnity.co.in;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name locolive.appnity.co.in;

    # SSL Certificates (update path if using different domain)
    ssl_certificate /etc/letsencrypt/live/locolive.appnity.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locolive.appnity.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── API Reverse Proxy (CRITICAL — must come BEFORE location /) ───
    location /api {
        proxy_pass http://locolive_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (chat)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ─── WebSocket endpoint (explicit for chat WS) ───
    location /ws/ {
        proxy_pass http://locolive_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Uploaded Media ───
    location /uploads/ {
        alias /var/www/locolive/locolive-backend-main/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── Frontend Static Assets (cache aggressively) ───
    location /assets/ {
        alias /var/www/locolive/locolive-frontend-main/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── PWA Files ───
    location = /manifest.webmanifest {
        root /var/www/locolive/locolive-frontend-main/frontend/dist;
        add_header Content-Type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sw.js {
        root /var/www/locolive/locolive-frontend-main/frontend/dist;
        add_header Content-Type application/javascript;
        add_header Cache-Control "public, max-age=0";
    }

    location = /registerSW.js {
        root /var/www/locolive/locolive-frontend-main/frontend/dist;
        add_header Content-Type application/javascript;
        add_header Cache-Control "public, max-age=0";
    }

    location ~ ^/pwa-\d+x\d+\.png$ {
        root /var/www/locolive/locolive-frontend-main/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.svg {
        root /var/www/locolive/locolive-frontend-main/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /favicon.ico {
        return 204;
    }

    # ─── SPA Fallback (catch-all, NO cache) ───
    location / {
        root /var/www/locolive/locolive-frontend-main/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # ─── Error Pages ───
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
